[Service]
# A crashing modem/DSP/WLAN subsystem restarts on its own ("RELATED") instead of
# taking the whole SoC down with it.
ExecStartPre=-/bin/sh -c 'for s in /sys/bus/msm_subsys/devices/subsys*; do echo RELATED > "$s/restart_level"; done'
# Android's ueventd leaves /dev/ion and /dev/kgsl-3d0 closed to the phablet
# session once the container has cold-booted; Mir/Lomiri (hybris EGL) need them.
ExecStartPost=/bin/chmod 0666 /dev/ion /dev/kgsl-3d0
