# Xiaomi reports a PC connection on the pc_port supply (the "usb" supply stays
# online=0) and only the pdphy extcon says USB=1; with the defaults usb-moded
# decided "dedicated_charger" and never offered MTP or adb.
[udev]
path = /sys/class/power_supply/pc_port
subsystem = power_supply
extcon_path = /sys/class/extcon/extcon5
extcon_subsystem = extcon
