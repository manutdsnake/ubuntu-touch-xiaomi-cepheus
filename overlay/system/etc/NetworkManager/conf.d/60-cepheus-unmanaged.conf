# The qcacld driver creates two station interfaces, wlan0 and wlan1, plus p2p0.
# NetworkManager managed all of them, so every access point appeared twice in
# the WiFi list (once per interface) and connections could land on either.
# Only wlan0 is meant for the user; leave the rest to the driver.
# usb0 is the debug gadget's NCM link, addressed by cepheus-adb-gadget.
[keyfile]
unmanaged-devices=interface-name:wlan1;interface-name:p2p0;interface-name:p2p-dev-wlan1;interface-name:usb0
